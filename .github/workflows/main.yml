name: CI

on:
  push:
    branches-ignore:
      - "renovate/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2

      - run: bun ci
      - run: bun run types
      - run: bun run lint
      - run: bun fmt --check
      - run: bun run test:unit:ci
      - run: bun run build:ci
