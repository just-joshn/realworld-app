name: CI

on:
  push:
    branches-ignore:
      - "renovate/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2

      - run: bun ci
      - run: bun run types
      - run: bun run lint
      - run: bun run copy:mock:awsexports
      - run: bun run test:unit
      - run: bun run style:check
      - run: bun fmt --check
      - run: node scripts/check-playwright-practices.mjs
      - run: bun run build:ci

  vitest:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Browsers and their OS deps are baked in. Keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # setup-bun extracts a zip with `unzip`, which the Playwright image does not ship.
      - name: Setup Bun
        run: |
          npm install --global --prefix "$HOME/.bun-npm" bun
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"

      - run: bun ci
      - run: bun run copy:mock:awsexports

      - name: Check image matches @playwright/test
        run: |
          image=$(node -p "require('/ms-playwright-agent/node_modules/playwright-core/package.json').version")
          repo=$(node -p "require('@playwright/test/package.json').version")
          test "$image" = "$repo" || { echo "::error::Playwright image is v$image but @playwright/test is $repo"; exit 1; }

      - run: bun run test:component
      - run: bun run test:integration

  playwright:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Browsers and their OS deps are baked in. Keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # setup-bun extracts a zip with `unzip`, which the Playwright image does not ship.
      - name: Setup Bun
        run: |
          npm install --global --prefix "$HOME/.bun-npm" bun
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"

      - run: bun ci

      - name: Check image matches @playwright/test
        run: |
          image=$(node -p "require('/ms-playwright-agent/node_modules/playwright-core/package.json').version")
          repo=$(node -p "require('@playwright/test/package.json').version")
          test "$image" = "$repo" || { echo "::error::Playwright image is v$image but @playwright/test is $repo"; exit 1; }

      - name: Run Playwright tests
        run: npx playwright test --grep-invert @flaky

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots, and videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-traces
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 7
